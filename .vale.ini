# Vale for dev-standard itself: the rules and the vocabulary are the template's (template/.vale/styles),
# the file-type sections mirror template/.vale.ini (tests/template-tests.sh compares them).
# A guardrail file (.guardrails).
# `scripts/check docs` picks the files (exclusions: VALE_EXCLUDE in check.config); this file only
# says how each language is linted.
StylesPath = template/.vale/styles
Vocab = DevStandard
MinAlertLevel = warning

# Markdown: prose.
[*.md]
BasedOnStyles = DevStandard, Project, Vale
Vale.Terms = NO
Vale.Spelling = warning
Vale.Avoid = NO

# Comments of the languages Vale reads (verified: Python, JavaScript, TypeScript, Rust, Go, C#,
# Java, Kotlin, Swift, C, C++, Ruby, PHP, Scala). Dart, shell, Lua, SQL, YAML and TOML comments
# are not read.
[*.{py,pyi,js,jsx,mjs,cjs,ts,tsx,rs,go,cs,java,kt,kts,swift,c,cc,cpp,h,hpp,rb,php,scala}]
BasedOnStyles = DevStandard, Project
DevStandard.HeadingCase = NO
