# Toolchain and dependencies for scripts/check (written by scripts/init for this stack).
name: setup
description: Toolchain and dependencies for scripts/check
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - shell: bash
      run: npm ci
