rules:
  - id: express-input-to-outgoing-request
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: "Request data reaches an outgoing request ($SINK) - SSRF. Allow-list exact hosts, https only, no redirects."
    metadata: { category: security, cwe: ["CWE-918"] }
    pattern-sources:
      - pattern-either:
          - pattern: '$REQ.query'
          - pattern: '$REQ.params'
          - pattern: '$REQ.body'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'axios.$VERB($SINK, ...)'
              - pattern: 'axios($SINK, ...)'
              - pattern: 'fetch($SINK, ...)'
              - pattern: 'got($SINK, ...)'
  - id: js-weak-hash
    languages: [typescript, javascript]
    severity: WARNING
    message: MD5/SHA-1 are broken for security use.
    metadata: { category: security, cwe: ["CWE-327"] }
    pattern-either:
      - pattern: 'crypto.createHash("md5")'
      - pattern: 'crypto.createHash("sha1")'
      - pattern: 'crypto.createHash(''md5'')'
  - id: js-unsafe-deserialize
    languages: [typescript, javascript]
    severity: ERROR
    message: node-serialize unserialize executes code from its input.
    metadata: { category: security, cwe: ["CWE-502"] }
    pattern: 'require(''node-serialize'').unserialize(...)'
