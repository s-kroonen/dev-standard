# Toolchain and dependencies for scripts/check (written by scripts/init for this stack).
name: setup
description: Toolchain and dependencies for scripts/check
runs:
  using: composite
  steps:
    # Pin to a commit SHA (Renovate keeps it current): actions/setup-python
    - uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
        cache: pip
    - shell: bash
      run: pip install -e ".[dev]"
